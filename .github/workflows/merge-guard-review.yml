name: merge-guard review

on:
  workflow_run:
    workflows: ["CI", "review relay"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: merge-guard-review
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mikomiel/merge-guard@647f49640a6d444b0b7481799df89ae376371f37
        with:
          mode: review
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
