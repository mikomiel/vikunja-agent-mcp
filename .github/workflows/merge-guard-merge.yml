name: merge-guard merge

on:
  workflow_run:
    workflows: ["merge-guard review"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: merge-guard-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mikomiel/merge-guard@647f49640a6d444b0b7481799df89ae376371f37
        with:
          mode: merge
